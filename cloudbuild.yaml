# ============================================================
# Cloud Build Configuration - FIXED VERSION
# ============================================================
# This version uses gcloud SDK container to update API Gateway
# ============================================================

steps:
  # Step 1: Terraform Format Check
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-fmt'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Checking Terraform formatting..."
        terraform fmt -check -recursive || echo "Warning: Formatting issues found"

  # Step 2: Terraform Init
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-init'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "============================================="
        echo "Initializing Terraform..."
        echo "============================================="
        terraform init -no-color

  # Step 3: Terraform Validate
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-validate'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "============================================="
        echo "Validating Terraform configuration..."
        echo "============================================="
        terraform validate -no-color

  # Step 4: Terraform Plan
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-plan'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "============================================="
        echo "Planning Terraform changes..."
        echo "Environment: ${_ENVIRONMENT}"
        echo "============================================="
        terraform plan \
          -var-file=environments/${_ENVIRONMENT}.tfvars \
          -out=tfplan \
          -no-color

  # Step 5: Terraform Apply (only on main branch)
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-apply'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${BRANCH_NAME}" = "main" ] || [ "${_FORCE_APPLY}" = "true" ]; then
          echo "============================================="
          echo "Applying Terraform changes..."
          echo "============================================="
          terraform apply -auto-approve tfplan -no-color
          echo ""
          echo "✅ Terraform apply completed!"
        else
          echo "============================================="
          echo "Skipping apply - not main branch"
          echo "Branch: ${BRANCH_NAME}"
          echo "============================================="
        fi

  # Step 6: Update API Gateway using gcloud (NEW!)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'update-gateway'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${BRANCH_NAME}" = "main" ] || [ "${_FORCE_APPLY}" = "true" ]; then
          echo "============================================="
          echo "Updating API Gateway..."
          echo "============================================="
          
          gcloud api-gateway gateways update ecommerce-gateway \
            --api=ecommerce-api \
            --api-config=ecommerce-config-v3 \
            --location=us-central1 \
            --project=$PROJECT_ID \
            --quiet
          
          echo ""
          echo "✅ Gateway updated successfully!"
          echo "Waiting 30 seconds for propagation..."
          sleep 30
        fi
    waitFor: ['terraform-apply']

  # Step 7: Terraform Output
  - name: 'hashicorp/terraform:1.6'
    id: 'terraform-output'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${BRANCH_NAME}" = "main" ] || [ "${_FORCE_APPLY}" = "true" ]; then
          echo "============================================="
          echo "📊 Deployment Summary"
          echo "============================================="
          terraform output -no-color configuration_summary
          echo ""
          echo "============================================="
          echo "🔑 API Key Information"
          echo "============================================="
          echo "To retrieve the API key, run:"
          echo "  terraform output -raw api_key"
          echo ""
          echo "Or from this build:"
          echo "  gcloud builds log $BUILD_ID | grep 'API Key'"
          echo "============================================="
          echo ""
          echo "✅ Deployment completed successfully!"
          echo "============================================="
        fi
    waitFor: ['update-gateway']

# Substitution variables
substitutions:
  _ENVIRONMENT: 'dev'
  _FORCE_APPLY: 'false'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  dynamicSubstitutions: true

# Timeout (30 minutes)
timeout: '1800s'
